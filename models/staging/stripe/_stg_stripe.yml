models: 
  - name: stg_stripe__payment
    description: one unique payment per row 
    columns:
      - name: payment_id 
        description: the primary key 
        data_tests:
          - unique 
          - not_null
      - name: status 
        description: "{{doc('payment_status')}}"
        data_tests:
          - accepted_values:
             arguments:
               values: ['success', 'fail'] 